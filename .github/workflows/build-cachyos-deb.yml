name: Build CachyOS Kernel for Debian

on:
  # ------------------------------------------------------------
  # 定时自动检查 CachyOS/linux-cachyos
  #
  # 定时构建使用下面默认参数：
  #   processor_opt = generic_v3
  #   lto            = thin
  #
  # 如果需要自定义参数，请在 GitHub Actions 页面手动 Run workflow。
  # ------------------------------------------------------------
  schedule:
    - cron: "17 */6 * * *"

  # ------------------------------------------------------------
  # 手动运行
  # ------------------------------------------------------------
  workflow_dispatch:
    inputs:

      processor_opt:
        description: "CPU optimization"
        required: true
        type: choice
        default: "generic_v3"
        options:
          - generic_v3
          - generic_v2
          - generic_v1
          - generic_v4
          - native
          - zen4

      lto:
        description: "LLVM LTO mode"
        required: true
        type: choice
        default: "thin"
        options:
          - thin
          - thin-dist
          - full

      force:
        description: "Force rebuild even if this exact build already exists"
        required: true
        type: boolean
        default: false


permissions:
  contents: write


concurrency:
  group: cachyos-debian-kernel
  cancel-in-progress: false


# ============================================================
# JOB 1
# Detect current CachyOS upstream
# ============================================================

jobs:

  detect:

    name: Detect CachyOS upstream

    runs-on: ubuntu-24.04

    outputs:
      major: ${{ steps.detect.outputs.major }}
      minor: ${{ steps.detect.outputs.minor }}
      tagrel: ${{ steps.detect.outputs.tagrel }}
      pkgrel: ${{ steps.detect.outputs.pkgrel }}

      srcname: ${{ steps.detect.outputs.srcname }}

      upstream_commit: ${{ steps.detect.outputs.upstream_commit }}
      patches_commit: ${{ steps.detect.outputs.patches_commit }}

      source_date_epoch: ${{ steps.detect.outputs.source_date_epoch }}

      fingerprint: ${{ steps.detect.outputs.fingerprint }}

    steps:

      # --------------------------------------------------------
      # Detect upstream PKGBUILD
      # --------------------------------------------------------

      - name: Detect upstream
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          rm -rf upstream

          git clone \
            --depth=1 \
            https://github.com/CachyOS/linux-cachyos.git \
            upstream

          PKGBUILD="upstream/linux-cachyos/PKGBUILD"
          CONFIG="upstream/linux-cachyos/config"

          test -f "$PKGBUILD"
          test -f "$CONFIG"

          echo "========================================"
          echo "linux-cachyos commit"
          echo "========================================"

          UPSTREAM_COMMIT="$(
            git -C upstream rev-parse HEAD
          )"

          echo "$UPSTREAM_COMMIT"

          echo "========================================"
          echo "kernel-patches commit"
          echo "========================================"

          PATCHES_COMMIT="$(
            git ls-remote \
              https://github.com/CachyOS/kernel-patches.git \
              HEAD |
            awk 'NR==1 {print $1}'
          )"

          test -n "$PATCHES_COMMIT"

          echo "$PATCHES_COMMIT"

          # ----------------------------------------------------
          # Extract version
          # ----------------------------------------------------

          MAJOR="$(
            sed -nE \
              's/^[[:space:]]*_major=([0-9.]+).*/\1/p' \
              "$PKGBUILD"
          )"

          MINOR="$(
            sed -nE \
              's/^[[:space:]]*_minor=([0-9]+).*/\1/p' \
              "$PKGBUILD"
          )"

          TAGREL="$(
            sed -nE \
              's/^[[:space:]]*_tagrel=([0-9]+).*/\1/p' \
              "$PKGBUILD"
          )"

          PKGREL="$(
            sed -nE \
              's/^[[:space:]]*pkgrel=([0-9]+).*/\1/p' \
              "$PKGBUILD"
          )"

          test -n "$MAJOR"
          test -n "$MINOR"
          test -n "$TAGREL"
          test -n "$PKGREL"

          SRCNAME="cachyos-${MAJOR}.${MINOR}-${TAGREL}"

          echo
          echo "MAJOR=$MAJOR"
          echo "MINOR=$MINOR"
          echo "TAGREL=$TAGREL"
          echo "PKGREL=$PKGREL"
          echo "SRCNAME=$SRCNAME"

          # ----------------------------------------------------
          # Stable build timestamp
          #
          # Important for reproducibility and ccache.
          # ----------------------------------------------------

          SOURCE_DATE_EPOCH="$(
            git -C upstream log -1 --format=%ct
          )"

          echo
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"

          # ----------------------------------------------------
          # Build fingerprint
          # ----------------------------------------------------

          {
            echo "linux-cachyos=$UPSTREAM_COMMIT"
            echo "kernel-patches=$PATCHES_COMMIT"

            sha256sum "$PKGBUILD"
            sha256sum "$CONFIG"
          } > build-inputs.txt

          FINGERPRINT="$(
            sha256sum build-inputs.txt |
            cut -d' ' -f1
          )"

          echo
          echo "========================================"
          echo "Build fingerprint"
          echo "========================================"

          cat build-inputs.txt

          echo
          echo "FINGERPRINT=$FINGERPRINT"

          # ----------------------------------------------------
          # Export job outputs
          # ----------------------------------------------------

          {
            echo "major=$MAJOR"
            echo "minor=$MINOR"
            echo "tagrel=$TAGREL"
            echo "pkgrel=$PKGREL"

            echo "srcname=$SRCNAME"

            echo "upstream_commit=$UPSTREAM_COMMIT"
            echo "patches_commit=$PATCHES_COMMIT"

            echo "source_date_epoch=$SOURCE_DATE_EPOCH"

            echo "fingerprint=$FINGERPRINT"
          } >> "$GITHUB_OUTPUT"


  # ============================================================
  # JOB 2
  # Build selected configuration
  # ============================================================

  build:

    name: Build selected CachyOS kernel

    needs:
      - detect

    runs-on: ubuntu-24.04

    env:

      CACHYOS_MAJOR: ${{ needs.detect.outputs.major }}
      CACHYOS_MINOR: ${{ needs.detect.outputs.minor }}
      CACHYOS_TAGREL: ${{ needs.detect.outputs.tagrel }}
      CACHYOS_PKGREL: ${{ needs.detect.outputs.pkgrel }}

      CACHYOS_SRCNAME: ${{ needs.detect.outputs.srcname }}

      UPSTREAM_COMMIT: ${{ needs.detect.outputs.upstream_commit }}
      PATCHES_COMMIT: ${{ needs.detect.outputs.patches_commit }}

      SOURCE_DATE_EPOCH: ${{ needs.detect.outputs.source_date_epoch }}

      BUILD_FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}

    steps:

      # ========================================================
      # 2.1 Resolve user configuration
      # ========================================================

      - name: Resolve build configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          # ----------------------------------------------------
          # Manual workflow
          # ----------------------------------------------------

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then

            PROCESSOR_OPT="${{ inputs.processor_opt }}"
            LTO="${{ inputs.lto }}"

          # ----------------------------------------------------
          # Scheduled workflow
          # ----------------------------------------------------

          else

            PROCESSOR_OPT="generic_v3"
            LTO="thin"

          fi

          # ----------------------------------------------------
          # Validate processor option
          # ----------------------------------------------------

          case "$PROCESSOR_OPT" in
            generic_v1)
              ;;
            generic_v2)
              ;;
            generic_v3)
              ;;
            generic_v4)
              ;;
            native)
              ;;
            zen4)
              ;;
            *)
              echo "Invalid processor_opt: $PROCESSOR_OPT"
              exit 1
              ;;
          esac

          # ----------------------------------------------------
          # Validate LTO
          # ----------------------------------------------------

          case "$LTO" in
            thin)
              ;;
            thin-dist)
              ;;
            full)
              ;;
            *)
              echo "Invalid LTO: $LTO"
              exit 1
              ;;
          esac

          echo "PROCESSOR_OPT=$PROCESSOR_OPT" >> "$GITHUB_ENV"
          echo "LTO=$LTO" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "Selected configuration"
          echo "========================================"

          echo "processor_opt = $PROCESSOR_OPT"
          echo "_use_llvm_lto = $LTO"


      # ========================================================
      # 2.2 Generate build identity
      # ========================================================

      - name: Generate build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          PROCESSOR_SAFE="${PROCESSOR_OPT//_/-}"

          VARIANT="${PROCESSOR_SAFE}-${LTO}"

          SHORT="${BUILD_FINGERPRINT:0:12}"

          RELEASE_TAG="cachyos-deb-${CACHYOS_MAJOR}.${CACHYOS_MINOR}-${CACHYOS_TAGREL}-${VARIANT}-${SHORT}"

          echo "PROCESSOR_SAFE=$PROCESSOR_SAFE" >> "$GITHUB_ENV"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "Build identity"
          echo "========================================"

          echo "Kernel:"
          echo "${CACHYOS_MAJOR}.${CACHYOS_MINOR}"

          echo
          echo "Processor:"
          echo "$PROCESSOR_OPT"

          echo
          echo "LTO:"
          echo "$LTO"

          echo
          echo "Variant:"
          echo "$VARIANT"

          echo
          echo "Release tag:"
          echo "$RELEASE_TAG"


      # ========================================================
      # 2.3 Check existing release
      # ========================================================

      - name: Check existing release
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          FORCE="${{ inputs.force }}"

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            FORCE="false"
          fi

          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."

            echo "already_built=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          if gh release view \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1
          then

            echo
            echo "========================================"
            echo "Release already exists"
            echo "========================================"

            echo "$RELEASE_TAG"

            echo "already_built=true" >> "$GITHUB_OUTPUT"

          else

            echo "No existing release."

            echo "already_built=false" >> "$GITHUB_OUTPUT"

          fi


      # ========================================================
      # 2.4 Checkout repository
      # ========================================================

      - name: Checkout
        if: steps.release_check.outputs.already_built != 'true'
        uses: actions/checkout@v7


      # ========================================================
      # 2.5 Free disk
      # ========================================================

      - name: Free disk space
        if: steps.release_check.outputs.already_built != 'true'
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/az || true

          sudo apt-get clean

          df -h


      # ========================================================
      # 2.6 Prepare ccache
      # ========================================================

      - name: Prepare ccache
        if: steps.release_check.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "ccache/${PROCESSOR_SAFE}-${LTO}"

          chmod 0777 \
            "ccache/${PROCESSOR_SAFE}-${LTO}"


      # ========================================================
      # 2.7 Restore ccache
      #
      # Exact key:
      #
      #   same upstream + same config
      #
      # Restore key:
      #
      #   new CachyOS version can still reuse older objects
      #
      # Native additionally includes the runner CPU ID.
      # ========================================================

      - name: Detect runner CPU
        if: steps.release_check.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail

          CPU_MODEL="$(
            lscpu |
            sed -n 's/^Model name:[[:space:]]*//p' |
            head -n1
          )"

          if [ "$PROCESSOR_OPT" = "native" ]; then

            CPU_ID="$(
              printf '%s\n' "$CPU_MODEL" |
              sha256sum |
              cut -c1-12
            )

          else

            CPU_ID="portable"

          fi

          echo "CPU_MODEL=$CPU_MODEL"
          echo "CPU_ID=$CPU_ID"

          echo "CPU_ID=$CPU_ID" >> "$GITHUB_ENV"


      - name: Restore ccache
        if: steps.release_check.outputs.already_built != 'true'
        uses: actions/cache@v6

        with:
          path: |
            ccache/${{ env.PROCESSOR_SAFE }}-${{ env.LTO }}

          key: >-
            ccache-v2-
            ${{ env.PROCESSOR_SAFE }}-
            ${{ env.LTO }}-
            ${{ env.CPU_ID }}-
            ${{ env.BUILD_FINGERPRINT }}

          restore-keys: |
            ccache-v2-${{ env.PROCESSOR_SAFE }}-${{ env.LTO }}-${{ env.CPU_ID }}-
            ccache-v2-${{ env.PROCESSOR_SAFE }}-${{ env.LTO }}-


      # ========================================================
      # 2.8 Fetch CachyOS
      # ========================================================

      - name: Fetch CachyOS linux-cachyos
        if: steps.release_check.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf upstream

          git clone \
            --depth=1 \
            https://github.com/CachyOS/linux-cachyos.git \
            upstream

          CURRENT_COMMIT="$(
            git -C upstream rev-parse HEAD
          )"

          echo "Current commit:"
          echo "$CURRENT_COMMIT"

          if [ "$CURRENT_COMMIT" != "$UPSTREAM_COMMIT" ]; then
            echo
            echo "ERROR:"
            echo "CachyOS/linux-cachyos changed during workflow."
            exit 1
          fi


      # ========================================================
      # 2.9 Build
      # ========================================================

      - name: Build Debian kernel
        if: steps.release_check.outputs.already_built != 'true'
        shell: bash
        env:
          PROCESSOR_OPT: ${{ env.PROCESSOR_OPT }}
          LTO: ${{ env.LTO }}

        run: |

          set -euxo pipefail

          docker pull archlinux:base-devel

          docker run \
            --rm \
            -e PROCESSOR_OPT="$PROCESSOR_OPT" \
            -e LTO="$LTO" \
            -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            -e CPU_ID="$CPU_ID" \
            -e PROCESSOR_SAFE="$PROCESSOR_SAFE" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -s <<'CONTAINER_SCRIPT'


          # ====================================================
          # Container setup
          # ====================================================

          set -euo pipefail


          echo "========================================"
          echo "Update Arch container"
          echo "========================================"

          pacman -Syu --noconfirm


          # ====================================================
          # Dependencies
          # ====================================================

          pacman -S --noconfirm --needed \
            bc \
            binutils \
            cpio \
            gettext \
            git \
            glibc \
            libelf \
            openssl \
            pahole \
            perl \
            python \
            rust \
            rust-bindgen \
            rust-src \
            tar \
            xxhash \
            xz \
            zlib \
            zstd \
            clang \
            llvm \
            lld \
            ccache \
            fakeroot


          # ====================================================
          # Build user
          # ====================================================

          echo "========================================"
          echo "Create build user"
          echo "========================================"

          if ! id builder >/dev/null 2>&1; then

            useradd \
              --create-home \
              --uid 1000 \
              --shell /bin/bash \
              builder

          fi


          chown -R \
            builder:builder \
            /workspace/upstream


          # ====================================================
          # Run upstream PKGBUILD prepare()
          # ====================================================

          echo "========================================"
          echo "Run upstream PKGBUILD prepare()"
          echo "========================================"

          cd /workspace/upstream/linux-cachyos


          runuser -u builder -- env \
            HOME=/home/builder \
            _processor_opt="$PROCESSOR_OPT" \
            _use_llvm_lto="$LTO" \
            CI= \
            GITHUB_RUN_ID= \
            GITHUB_ACTIONS= \
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            bash -c '
              set -euo pipefail

              cd /workspace/upstream/linux-cachyos

              makepkg \
                --nobuild \
                --nodeps \
                --skippgpcheck
            '


          # ====================================================
          # Locate prepared source
          # ====================================================

          echo "========================================"
          echo "Locate prepared kernel source"
          echo "========================================"

          SRC_DIR="$(
            find src \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name "cachyos-*" |
            head -n1
          )"

          test -n "$SRC_DIR"
          test -f "$SRC_DIR/.config"

          echo "SRC_DIR=$SRC_DIR"


          # ====================================================
          # Apply matrix/user selected parameters
          # ====================================================

          cd "$SRC_DIR"


          # ----------------------------------------------------
          # Re-apply processor selection explicitly.
          #
          # This makes the final configuration independent of
          # any environment changes made by makepkg.
          # ----------------------------------------------------

          case "$PROCESSOR_OPT" in

            generic_v1)
              scripts/config \
                -e GENERIC_CPU \
                -d MZEN4 \
                -d X86_NATIVE_CPU \
                --set-val X86_64_VERSION 1
              ;;

            generic_v2)
              scripts/config \
                -e GENERIC_CPU \
                -d MZEN4 \
                -d X86_NATIVE_CPU \
                --set-val X86_64_VERSION 2
              ;;

            generic_v3)
              scripts/config \
                -e GENERIC_CPU \
                -d MZEN4 \
                -d X86_NATIVE_CPU \
                --set-val X86_64_VERSION 3
              ;;

            generic_v4)
              scripts/config \
                -e GENERIC_CPU \
                -d MZEN4 \
                -d X86_NATIVE_CPU \
                --set-val X86_64_VERSION 4
              ;;

            native)
              scripts/config \
                -d GENERIC_CPU \
                -d MZEN4 \
                -e X86_NATIVE_CPU
              ;;

            zen4)
              scripts/config \
                -d GENERIC_CPU \
                -e MZEN4 \
                -d X86_NATIVE_CPU
              ;;

            *)
              echo "Invalid processor option:"
              echo "$PROCESSOR_OPT"
              exit 1
              ;;

          esac


          # ----------------------------------------------------
          # Explicit LTO selection
          # ----------------------------------------------------

          case "$LTO" in

            thin)

              scripts/config \
                -e LTO_CLANG_THIN \
                -d LTO_CLANG_FULL \
                -d LTO_CLANG_THIN_DIST

              ;;

            thin-dist)

              scripts/config \
                -d LTO_CLANG_THIN \
                -d LTO_CLANG_FULL \
                -e LTO_CLANG_THIN_DIST

              ;;

            full)

              scripts/config \
                -d LTO_CLANG_THIN \
                -e LTO_CLANG_FULL \
                -d LTO_CLANG_THIN_DIST

              ;;

            *)

              echo "Invalid LTO:"
              echo "$LTO"
              exit 1

              ;;

          esac


          # ====================================================
          # Requested debug configuration
          #
          # EXACTLY as requested
          # ====================================================

          echo "========================================"
          echo "Configure debug information"
          echo "========================================"

          scripts/config \
            -d DEBUG_KERNEL \
            -e DEBUG_INFO_REDUCED


          # ====================================================
          # Stable localversion
          # ====================================================

          PROCESSOR_SAFE="${PROCESSOR_OPT//_/-}"

          MATRIX_VERSION="${PROCESSOR_SAFE}-${LTO}"

          printf '%s\n' \
            "-${MATRIX_VERSION}" \
            > localversion.90-debian-matrix


          # ====================================================
          # Remove downloaded source archive
          #
          # The source tree is already extracted.
          # This saves runner disk space.
          # ====================================================

          rm -f \
            ../*.tar.gz \
            ../*.tar.zst \
            ../*.tar.xz \
            ../*.asc \
            2>/dev/null || true


          # ====================================================
          # Final Kconfig normalization
          # ====================================================

          echo "========================================"
          echo "Kernel Kconfig"
          echo "========================================"

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig


          # ====================================================
          # Show final configuration
          # ====================================================

          echo "========================================"
          echo "Final configuration"
          echo "========================================"

          grep -E \
            '^CONFIG_(CACHY|SCHED_BORE|LTO_CLANG_|HZ_1000|HZ=|NO_HZ_FULL|PREEMPT|CC_OPTIMIZE_FOR_PERFORMANCE_O3|TRANSPARENT_HUGEPAGE_|DEBUG_KERNEL|DEBUG_INFO|DEBUG_INFO_REDUCED|DEBUG_INFO_DWARF_)' \
            .config \
            || true


          # ====================================================
          # IMPORTANT:
          #
          # Check whether requested debug setting survived
          # Kconfig dependency resolution.
          # ====================================================

          if grep -q '^CONFIG_DEBUG_KERNEL=y$' .config; then
            echo
            echo "WARNING: CONFIG_DEBUG_KERNEL is still enabled."
          else
            echo
            echo "CONFIG_DEBUG_KERNEL is disabled."
          fi


          if grep -q '^CONFIG_DEBUG_INFO_REDUCED=y$' .config; then
            echo
            echo "CONFIG_DEBUG_INFO_REDUCED=y"
          else
            echo
            echo "CONFIG_DEBUG_INFO_REDUCED is NOT enabled after Kconfig."
            echo "This may be caused by CONFIG_DEBUG_INFO/DEBUG_KERNEL dependencies."
          fi


          # ====================================================
          # Kernel release
          # ====================================================

          KERNEL_RELEASE="$(
            make -s kernelrelease
          )

          echo "$KERNEL_RELEASE" \
            > /workspace/kernel-release.txt

          echo
          echo "========================================"
          echo "Kernel release"
          echo "========================================"

          echo "$KERNEL_RELEASE"


          # ====================================================
          # Compiler versions
          # ====================================================

          echo
          echo "========================================"
          echo "Toolchain"
          echo "========================================"

          clang --version
          ld.lld --version
          ccache --version
          rustc --version
          pahole --version


          # ====================================================
          # ccache
          # ====================================================

          echo
          echo "========================================"
          echo "Configure ccache"
          echo "========================================"

          export CCACHE_DIR="/workspace/ccache/${PROCESSOR_SAFE}-${LTO}"

          export CCACHE_COMPILERCHECK=content

          export CCACHE_BASEDIR=/workspace/upstream

          export CCACHE_SLOPPINESS=time_macros

          # ----------------------------------------------------
          # 1.2 GiB per configuration
          # ----------------------------------------------------

          ccache \
            --max-size=1200M

          echo
          echo "ccache directory:"
          echo "$CCACHE_DIR"

          echo
          echo "ccache configuration:"
          ccache --show-config

          echo
          echo "ccache statistics BEFORE:"
          ccache --show-stats


          # ====================================================
          # Stable build metadata
          # ====================================================

          export KBUILD_BUILD_USER=cachyos-debian

          export KBUILD_BUILD_HOST=github-actions

          export KBUILD_BUILD_TIMESTAMP="$(
            date -Ru \
              -d "@${SOURCE_DATE_EPOCH}"
          )"


          # ====================================================
          # Build Debian packages
          # ====================================================

          echo
          echo "========================================"
          echo "Build kernel"
          echo "========================================"

          runuser -u builder -- env \
            HOME=/home/builder \
            CCACHE_DIR="$CCACHE_DIR" \
            CCACHE_COMPILERCHECK=content \
            CCACHE_BASEDIR=/workspace/upstream \
            CCACHE_SLOPPINESS=time_macros \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            KBUILD_BUILD_TIMESTAMP="$KBUILD_BUILD_TIMESTAMP" \
            bash -c '

              set -euo pipefail

              cd "'"$SRC_DIR"'"

              make \
                LLVM=1 \
                LLVM_IAS=1 \
                CC="ccache clang" \
                -j"$(nproc)" \
                bindeb-pkg

            '


          # ====================================================
          # ccache statistics AFTER
          # ====================================================

          echo
          echo "========================================"
          echo "ccache statistics AFTER"
          echo "========================================"

          ccache --show-stats


          # ====================================================
          # Collect packages
          # ====================================================

          echo
          echo "========================================"
          echo "Generated Debian packages"
          echo "========================================"

          find /workspace/upstream \
            -maxdepth 2 \
            -type f \
            -name "*.deb" \
            -ls


          mkdir -p /workspace/dist


          find /workspace/upstream \
            -maxdepth 2 \
            -type f \
            -name "*.deb" \
            -exec cp {} /workspace/dist/ \;


          CONTAINER_SCRIPT


      # ========================================================
      # 2.10 Generate metadata
      # ========================================================

      - name: Generate build metadata
        if: steps.release_check.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_RELEASE="$(cat kernel-release.txt)"

          {
            echo "CachyOS Kernel for Debian"
            echo
            echo "========================================"
            echo "Build configuration"
            echo "========================================"
            echo
            echo "processor_opt:"
            echo "$PROCESSOR_OPT"
            echo
            echo "_use_llvm_lto:"
            echo "$LTO"
            echo
            echo "========================================"
            echo "Kernel"
            echo "========================================"
            echo
            echo "Kernel release:"
            echo "$KERNEL_RELEASE"
            echo
            echo "CachyOS version:"
            echo "${CACHYOS_MAJOR}.${CACHYOS_MINOR}-${CACHYOS_TAGREL}"
            echo
            echo "CachyOS linux-cachyos commit:"
            echo "$UPSTREAM_COMMIT"
            echo
            echo "CachyOS kernel-patches commit:"
            echo "$PATCHES_COMMIT"
            echo
            echo "Build fingerprint:"
            echo "$BUILD_FINGERPRINT"
            echo
            echo "CPU ID:"
            echo "$CPU_ID"
            echo
            echo "Release tag:"
            echo "$RELEASE_TAG"
            echo
            echo "========================================"
            echo "Debug configuration"
            echo "========================================"
            echo
            echo "Requested:"
            echo "CONFIG_DEBUG_KERNEL=n"
            echo "CONFIG_DEBUG_INFO_REDUCED=y"
          } > dist/BUILD-INFO.txt


          sha256sum \
            dist/*.deb \
            > dist/SHA256SUMS


          echo
          echo "========================================"
          echo "SHA256"
          echo "========================================"

          cat dist/SHA256SUMS


      # ========================================================
      # 2.11 Upload artifact
      # ========================================================

      - name: Upload Debian packages
        if: steps.release_check.outputs.already_built != 'true'
        uses: actions/upload-artifact@v7

        with:

          name: >-
            cachyos-debian-
            ${{ env.PROCESSOR_SAFE }}-
            ${{ env.LTO }}-
            ${{ env.BUILD_FINGERPRINT }}

          path: |
            dist/*

          if-no-files-found: error

          retention-days: 30


      # ========================================================
      # 2.12 Create GitHub Release
      # ========================================================

      - name: Create GitHub Release
        if: steps.release_check.outputs.already_built != 'true'
        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          set -euxo pipefail

          KERNEL_RELEASE="$(
            cat kernel-release.txt
          )"


          gh release create \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CachyOS Debian Kernel ${KERNEL_RELEASE}" \
            --notes "$(cat <<EOF
          # CachyOS Kernel for Debian

          Automatically built from CachyOS/linux-cachyos.

          ## Build configuration

          Processor optimization:

          \`${PROCESSOR_OPT}\`

          LLVM LTO:

          \`${LTO}\`

          ## Debug configuration

          \`\`\`
          CONFIG_DEBUG_KERNEL=n
          CONFIG_DEBUG_INFO_REDUCED=y
          \`\`\`

          ## Kernel

          Kernel release:

          \`${KERNEL_RELEASE}\`

          CachyOS version:

          \`${CACHYOS_MAJOR}.${CACHYOS_MINOR}-${CACHYOS_TAGREL}\`

          ## Upstream

          linux-cachyos:

          \`${UPSTREAM_COMMIT}\`

          kernel-patches:

          \`${PATCHES_COMMIT}\`

          Build fingerprint:

          \`${BUILD_FINGERPRINT}\`

          ## Toolchain

          - Arch Linux build container
          - Clang
          - LLVM
          - LLD
          - ccache
          - Linux Kbuild
          - bindeb-pkg

          ## CPU optimization note

          \`generic_v3\` is portable across x86-64-v3 systems.

          \`native\` is optimized for the CPU of the GitHub Actions runner
          that performed the build and therefore should not be considered
          portable to arbitrary systems.

          EOF
          )" \
            dist/*.deb \
            dist/BUILD-INFO.txt \
            dist/SHA256SUMS
