name: Build CachyOS Kernel for Debian

on:
  # ============================================================
  # 自动检查 CachyOS/linux-cachyos
  #
  # 定时运行默认：
  #   processor_opt = generic_v3
  #   _use_llvm_lto = thin
  # ============================================================
  schedule:
    - cron: "17 */6 * * *"

  # ============================================================
  # 手动运行
  # ============================================================
  workflow_dispatch:
    inputs:

      processor_opt:
        description: "Processor optimization"
        required: true
        type: choice
        default: "generic_v3"
        options:
          - generic_v3
          - generic_v2
          - generic_v1
          - generic_v4
          - native
          - zen4

      _use_llvm_lto:
        description: "LLVM LTO mode"
        required: true
        type: choice
        default: "thin"
        options:
          - thin
          - thin-dist
          - full

      force:
        description: "Force rebuild even if the same build already exists"
        required: true
        type: boolean
        default: false


# ==============================================================
# GitHub permissions
# ==============================================================

permissions:
  contents: write


# ==============================================================
# Prevent multiple identical builds at the same time
# ==============================================================

concurrency:
  group: cachyos-debian-kernel
  cancel-in-progress: false


jobs:

  # ============================================================
  # JOB: Build
  # ============================================================

  build:

    name: Build CachyOS Debian Kernel

    runs-on: ubuntu-24.04

    env:

      # ----------------------------------------------------------
      # Manual input
      #
      # Scheduled builds have no workflow_dispatch inputs,
      # therefore use defaults.
      # ----------------------------------------------------------

      PROCESSOR_OPT: ${{ inputs.processor_opt || 'generic_v3' }}

      USE_LLVM_LTO: ${{ inputs._use_llvm_lto || 'thin' }}


    steps:

      # ==========================================================
      # 1. Checkout this repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ==========================================================
      # 2. Show selected configuration
      # ==========================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build configuration"
          echo "========================================"

          echo "Event:"
          echo "$GITHUB_EVENT_NAME"

          echo
          echo "processor_opt:"
          echo "$PROCESSOR_OPT"

          echo
          echo "_use_llvm_lto:"
          echo "$USE_LLVM_LTO"


      # ==========================================================
      # 3. Free some disk space
      # ==========================================================

      - name: Free disk space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/az || true

          sudo apt-get clean

          echo
          df -h


      # ==========================================================
      # 4. Detect current runner CPU
      #
      # Only matters for processor_opt=native.
      #
      # IMPORTANT:
      # native = GitHub runner CPU
      # NOT user's RedmiBook CPU.
      # ==========================================================

      - name: Detect runner CPU
        shell: bash
        run: |
          set -euo pipefail

          if [ "$PROCESSOR_OPT" = "native" ]; then

            CPU_MODEL=$(
              LC_ALL=C lscpu |
              awk -F: '
                $1 == "Model name" {
                  gsub(/^[[:space:]]+/, "", $2)
                  print $2
                  exit
                }
              '
            )

            CPU_ID=$(
              printf '%s' "$CPU_MODEL" |
              sha256sum |
              awk '{print substr($1,1,12)}'
            )

          else

            CPU_MODEL="portable"
            CPU_ID="portable"

          fi

          echo "CPU_MODEL=$CPU_MODEL"
          echo "CPU_ID=$CPU_ID"

          printf 'CPU_ID=%s\n' "$CPU_ID" >> "$GITHUB_ENV"


      # ==========================================================
      # 5. Clone latest CachyOS/linux-cachyos
      # ==========================================================

      - name: Clone latest CachyOS linux-cachyos
        shell: bash
        run: |
          set -euo pipefail

          rm -rf upstream

          git clone \
            --depth=1 \
            https://github.com/CachyOS/linux-cachyos.git \
            upstream

          echo
          echo "========================================"
          echo "CachyOS linux-cachyos"
          echo "========================================"

          git -C upstream log -1 \
            --format='commit %H%nDate   %aI%nSubject %s'


      # ==========================================================
      # 6. Locate PKGBUILD
      # ==========================================================

      - name: Locate CachyOS PKGBUILD
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PKGBUILD=""

          for candidate in \
            upstream/linux-cachyos/PKGBUILD \
            upstream/PKGBUILD
          do

            if [ -f "$candidate" ]; then
              PKGBUILD="$candidate"
              break
            fi

          done

          if [ -z "$PKGBUILD" ]; then
            echo "ERROR: Cannot find linux-cachyos/PKGBUILD"
            find upstream -maxdepth 4 -name PKGBUILD -print
            exit 1
          fi

          PKGDIR="$(dirname "$PKGBUILD")"

          echo "PKGBUILD=$PKGBUILD"
          echo "PKGDIR=$PKGDIR"

          {
            echo "PKGBUILD=$PKGBUILD"
            echo "PKGDIR=$PKGDIR"
          } >> "$GITHUB_ENV"


      # ==========================================================
      # 7. Parse current version from PKGBUILD
      #
      # _processor_opt and _use_llvm_lto are exported before
      # sourcing PKGBUILD so that pkgbase/package suffix is
      # calculated using the user's selected LTO.
      # ==========================================================

      - name: Parse CachyOS PKGBUILD
        id: metadata
        shell: bash
        env:
          _processor_opt: ${{ env.PROCESSOR_OPT }}
          _use_llvm_lto: ${{ env.USE_LLVM_LTO }}
        run: |
          set -euo pipefail

          cd "$PKGDIR"

          # shellcheck disable=SC1091
          source ./PKGBUILD

          echo
          echo "========================================"
          echo "CachyOS PKGBUILD metadata"
          echo "========================================"

          echo "pkgbase     = $pkgbase"
          echo "pkgver      = $pkgver"
          echo "pkgrel      = $pkgrel"
          echo "_major      = $_major"
          echo "_minor      = $_minor"
          echo "_tagrel     = $_tagrel"
          echo "_srcname    = $_srcname"

          echo
          echo "processor_opt:"
          echo "$_processor_opt"

          echo
          echo "use_llvm_lto:"
          echo "$_use_llvm_lto"

          {
            echo "CACHYOS_MAJOR=$_major"
            echo "CACHYOS_MINOR=$_minor"
            echo "CACHYOS_TAGREL=$_tagrel"
            echo "CACHYOS_PKGVER=$pkgver"
            echo "CACHYOS_PKGREL=$pkgrel"
            echo "CACHYOS_SRCNAME=$_srcname"
            echo "CACHYOS_PKGBASE=$pkgbase"
          } >> "$GITHUB_ENV"


      # ==========================================================
      # 8. Generate build fingerprint
      # ==========================================================

      - name: Generate build fingerprint
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT=$(
            git -C upstream rev-parse HEAD
          )

          BUILD_FINGERPRINT=$(
            {
              printf '%s\n' "$UPSTREAM_COMMIT"
              sha256sum "$PKGBUILD"
              sha256sum "$PKGDIR/config"
              printf '%s\n' "$PROCESSOR_OPT"
              printf '%s\n' "$USE_LLVM_LTO"
            } |
            sha256sum |
            cut -d' ' -f1
          )

          echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT" >> "$GITHUB_ENV"
          echo "BUILD_FINGERPRINT=$BUILD_FINGERPRINT" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "Build fingerprint"
          echo "========================================"

          echo "$BUILD_FINGERPRINT"


      # ==========================================================
      # 9. Generate names
      # ==========================================================

      - name: Generate build names
        shell: bash
        run: |
          set -euo pipefail

          PROCESSOR_SAFE="${PROCESSOR_OPT//_/-}"

          VARIANT="${PROCESSOR_SAFE}-${USE_LLVM_LTO}"

          RELEASE_TAG="cachyos-deb-${CACHYOS_PKGVER}-${CACHYOS_PKGREL}-${VARIANT}-${BUILD_FINGERPRINT:0:12}"

          echo "PROCESSOR_SAFE=$PROCESSOR_SAFE" >> "$GITHUB_ENV"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          echo
          echo "Variant:"
          echo "$VARIANT"

          echo
          echo "Release:"
          echo "$RELEASE_TAG"


      # ==========================================================
      # 10. Check whether exact release already exists
      # ==========================================================

      - name: Check existing release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FORCE="false"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            FORCE="${{ inputs.force }}"
          fi

          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."
            echo "already_built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1
          then

            echo
            echo "========================================"
            echo "Build already exists"
            echo "========================================"

            echo "$RELEASE_TAG"

            echo "already_built=true" >> "$GITHUB_OUTPUT"

          else

            echo "No existing release."

            echo "already_built=false" >> "$GITHUB_OUTPUT"

          fi


      # ==========================================================
      # 11. Restore ccache
      # ==========================================================

      - name: Restore ccache
        if: steps.release.outputs.already_built != 'true'
        uses: actions/cache@v6
        with:
          path: |
            .ccache/${{ env.PROCESSOR_SAFE }}-${{ env.USE_LLVM_LTO }}

          key: >-
            cachyos-ccache-v2-
            ${{ env.PROCESSOR_SAFE }}-
            ${{ env.USE_LLVM_LTO }}-
            ${{ env.CPU_ID }}-
            ${{ env.BUILD_FINGERPRINT }}

          restore-keys: |
            cachyos-ccache-v2-${{ env.PROCESSOR_SAFE }}-${{ env.USE_LLVM_LTO }}-${{ env.CPU_ID }}-
            cachyos-ccache-v2-${{ env.PROCESSOR_SAFE }}-${{ env.USE_LLVM_LTO }}-


      # ==========================================================
      # 12. Prepare ccache
      # ==========================================================

      - name: Configure ccache
        if: steps.release.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            ".ccache/${PROCESSOR_SAFE}-${USE_LLVM_LTO}"

          chmod 0777 \
            ".ccache/${PROCESSOR_SAFE}-${USE_LLVM_LTO}"

          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache/${PROCESSOR_SAFE}-${USE_LLVM_LTO}"

          ccache --max-size=1200M

          echo
          echo "========================================"
          echo "ccache"
          echo "========================================"

          ccache --show-config
          ccache --show-stats

          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"


      # ==========================================================
      # 13. Write build script for Arch container
      #
      # This avoids the nested heredoc/quote problem from the
      # previous workflow.
      # ==========================================================

      - name: Create container build script
        if: steps.release.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/build-kernel.sh" <<'BUILD_SCRIPT'
          #!/usr/bin/env bash

          set -euo pipefail


          # ======================================================
          # Basic variables
          # ======================================================

          PKGDIR="${PKGDIR:?}"
          PROCESSOR_OPT="${PROCESSOR_OPT:?}"
          USE_LLVM_LTO="${USE_LLVM_LTO:?}"
          CCACHE_HOST_DIR="${CCACHE_HOST_DIR:?}"
          SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:?}"


          echo "========================================"
          echo "Container build"
          echo "========================================"

          echo "PKGDIR:"
          echo "$PKGDIR"

          echo
          echo "processor_opt:"
          echo "$PROCESSOR_OPT"

          echo
          echo "_use_llvm_lto:"
          echo "$USE_LLVM_LTO"


          # ======================================================
          # Create build user
          # ======================================================

          if ! id builder >/dev/null 2>&1; then

            useradd \
              --create-home \
              --uid 1000 \
              --shell /bin/bash \
              builder

          fi


          # ======================================================
          # Update Arch Linux
          # ======================================================

          pacman -Syu --noconfirm


          # ======================================================
          # Install dependencies
          # ======================================================

          pacman -S --needed --noconfirm \
            bc \
            bison \
            clang \
            cpio \
            fakeroot \
            flex \
            gcc \
            gettext \
            git \
            libelf \
            lld \
            llvm \
            ncurses \
            openssl \
            pahole \
            perl \
            python \
            rsync \
            rust \
            rust-bindgen \
            rust-src \
            tar \
            wget \
            xz \
            zlib \
            zstd \
            ccache \
            dpkg


          # ======================================================
          # Locate PKGBUILD
          # ======================================================

          if [ -f "/workspace/$PKGDIR/PKGBUILD" ]; then
            PKGROOT="/workspace/$PKGDIR"
          else
            echo "PKGBUILD not found:"
            echo "/workspace/$PKGDIR/PKGBUILD"
            exit 1
          fi


          cd "$PKGROOT"


          echo
          echo "========================================"
          echo "PKGBUILD"
          echo "========================================"

          pwd
          ls -la


          # ======================================================
          # Clean old makepkg state
          # ======================================================

          rm -rf src pkg


          # ======================================================
          # Give builder access
          # ======================================================

          chown -R builder:builder "$PKGROOT"

          mkdir -p "$CCACHE_HOST_DIR"

          chown -R builder:builder "$CCACHE_HOST_DIR"


          # ======================================================
          # Run makepkg preparation
          #
          # IMPORTANT:
          #
          # We pass the user's selected:
          #
          #   _processor_opt
          #   _use_llvm_lto
          #
          # directly into PKGBUILD.
          #
          # CI variables are intentionally retained so that the
          # upstream PKGBUILD's CI-specific configuration executes
          # when it supports that mechanism.
          # ======================================================

          echo
          echo "========================================"
          echo "makepkg --nobuild"
          echo "========================================"

          runuser -u builder -- env \
            HOME=/home/builder \
            CI=1 \
            GITHUB_RUN_ID="${GITHUB_RUN_ID:-1}" \
            GITHUB_ACTIONS=true \
            _processor_opt="$PROCESSOR_OPT" \
            _use_llvm_lto="$USE_LLVM_LTO" \
            bash -c '
              set -euo pipefail

              cd "'"$PKGROOT"'"

              makepkg \
                --nobuild \
                --nodeps \
                --skippgpcheck
            '


          # ======================================================
          # Locate extracted kernel source
          # ======================================================

          SRC_DIR="$(
            find "$PKGROOT/src" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name "cachyos-*" |
            head -n1
          )"


          if [ -z "$SRC_DIR" ]; then

            echo
            echo "ERROR: Cannot find extracted kernel source."

            find "$PKGROOT/src" \
              -maxdepth 2 \
              -type d \
              -print || true

            exit 1

          fi


          echo
          echo "========================================"
          echo "Kernel source"
          echo "========================================"

          echo "$SRC_DIR"


          # ======================================================
          # Make sure .config exists
          # ======================================================

          if [ ! -f "$SRC_DIR/.config" ]; then

            echo "ERROR: .config does not exist."

            exit 1

          fi


          cd "$SRC_DIR"


          # ======================================================
          # Explicit processor configuration
          #
          # This is deliberately performed AFTER makepkg
          # preparation so that the user's choice wins.
          # ======================================================

          echo
          echo "========================================"
          echo "Processor optimization"
          echo "========================================"

          case "$PROCESSOR_OPT" in

            generic_v1)

              scripts/config \
                -e GENERIC_CPU \
                -d MZEN4 \
                -d X86_NATIVE_CPU \
                --set-val X86_64_VERSION 1

              ;;


            generic_v2)

              scripts/config \
                -e GENERIC_CPU \
                -d MZEN4 \
                -d X86_NATIVE_CPU \
                --set-val X86_64_VERSION 2

              ;;


            generic_v3)

              scripts/config \
                -e GENERIC_CPU \
                -d MZEN4 \
                -d X86_NATIVE_CPU \
                --set-val X86_64_VERSION 3

              ;;


            generic_v4)

              scripts/config \
                -e GENERIC_CPU \
                -d MZEN4 \
                -d X86_NATIVE_CPU \
                --set-val X86_64_VERSION 4

              ;;


            native)

              scripts/config \
                -d GENERIC_CPU \
                -d MZEN4 \
                -e X86_NATIVE_CPU

              ;;


            zen4)

              scripts/config \
                -d GENERIC_CPU \
                -e MZEN4 \
                -d X86_NATIVE_CPU

              ;;


            *)

              echo "Invalid processor_opt:"
              echo "$PROCESSOR_OPT"

              exit 1

              ;;

          esac


          # ======================================================
          # Explicit LLVM LTO configuration
          # ======================================================

          echo
          echo "========================================"
          echo "LLVM LTO"
          echo "========================================"

          case "$USE_LLVM_LTO" in

            thin)

              scripts/config \
                -e LTO_CLANG_THIN \
                -d LTO_CLANG_FULL \
                -d LTO_CLANG_THIN_DIST

              ;;


            thin-dist)

              scripts/config \
                -d LTO_CLANG_THIN \
                -d LTO_CLANG_FULL \
                -e LTO_CLANG_THIN_DIST

              ;;


            full)

              scripts/config \
                -d LTO_CLANG_THIN \
                -e LTO_CLANG_FULL \
                -d LTO_CLANG_THIN_DIST

              ;;


            *)

              echo "Invalid _use_llvm_lto:"
              echo "$USE_LLVM_LTO"

              exit 1

              ;;

          esac


          # ======================================================
          # Requested debug configuration
          #
          # EXACTLY as requested.
          # ======================================================

          echo
          echo "========================================"
          echo "Debug configuration"
          echo "========================================"

          scripts/config \
            -d DEBUG_KERNEL \
            -e DEBUG_INFO_REDUCED


          # ======================================================
          # Recalculate Kconfig dependencies
          # ======================================================

          echo
          echo "========================================"
          echo "olddefconfig"
          echo "========================================"

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig


          # ======================================================
          # Show relevant final configuration
          # ======================================================

          echo
          echo "========================================"
          echo "Final kernel configuration"
          echo "========================================"

          grep -E \
            '^CONFIG_(GENERIC_CPU|X86_64_VERSION|X86_NATIVE_CPU|MZEN4|LTO_CLANG_|LTO_NONE|SCHED_BORE|PREEMPT_RT|HZ|PREEMPT|DEBUG_KERNEL|DEBUG_INFO|CC_OPTIMIZE_FOR_PERFORMANCE_O3)' \
            .config \
            || true


          # ======================================================
          # Explicit debug check
          # ======================================================

          echo
          echo "========================================"
          echo "Debug check"
          echo "========================================"

          if grep -q '^CONFIG_DEBUG_KERNEL=y$' .config; then

            echo "WARNING:"
            echo "CONFIG_DEBUG_KERNEL is still enabled."

          else

            echo "CONFIG_DEBUG_KERNEL is disabled."

          fi


          if grep -q '^CONFIG_DEBUG_INFO_REDUCED=y$' .config; then

            echo "CONFIG_DEBUG_INFO_REDUCED=y"

          else

            echo "WARNING:"
            echo "CONFIG_DEBUG_INFO_REDUCED is not enabled."

          fi


          # ======================================================
          # Generate kernel local version
          # ======================================================

          PROCESSOR_SAFE="${PROCESSOR_OPT//_/-}"

          BUILD_VARIANT="${PROCESSOR_SAFE}-${USE_LLVM_LTO}"

          printf '%s\n' \
            "-${BUILD_VARIANT}" \
            > localversion.90-cachyos-debian


          # ======================================================
          # Kernel release
          # ======================================================

          KERNEL_RELEASE="$(
            make -s kernelrelease
          )"


          echo
          echo "========================================"
          echo "Kernel release"
          echo "========================================"

          echo "$KERNEL_RELEASE"


          printf '%s\n' \
            "$KERNEL_RELEASE" \
            > /workspace/kernel-release.txt


          # ======================================================
          # Configure ccache
          # ======================================================

          export CCACHE_DIR="$CCACHE_HOST_DIR"

          export CCACHE_COMPILERCHECK=content

          export CCACHE_BASEDIR="$PKGROOT"

          export CCACHE_SLOPPINESS=time_macros

          ccache \
            --max-size=1200M


          echo
          echo "========================================"
          echo "ccache BEFORE"
          echo "========================================"

          ccache --show-stats


          # ======================================================
          # Build metadata
          # ======================================================

          export KBUILD_BUILD_USER=cachyos-debian

          export KBUILD_BUILD_HOST=github-actions

          export KBUILD_BUILD_TIMESTAMP="$(
            date -Ru \
              -d "@${SOURCE_DATE_EPOCH}"
          )"


          # ======================================================
          # Build Debian packages
          # ======================================================

          echo
          echo "========================================"
          echo "Build Debian packages"
          echo "========================================"

          runuser -u builder -- env \
            HOME=/home/builder \
            CCACHE_DIR="$CCACHE_DIR" \
            CCACHE_COMPILERCHECK=content \
            CCACHE_BASEDIR="$PKGROOT" \
            CCACHE_SLOPPINESS=time_macros \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            KBUILD_BUILD_TIMESTAMP="$KBUILD_BUILD_TIMESTAMP" \
            bash -c '

              set -euo pipefail

              cd "'"$SRC_DIR"'"

              make \
                LLVM=1 \
                LLVM_IAS=1 \
                CC="ccache clang" \
                -j"$(nproc)" \
                bindeb-pkg

            '


          # ======================================================
          # ccache statistics
          # ======================================================

          echo
          echo "========================================"
          echo "ccache AFTER"
          echo "========================================"

          ccache --show-stats


          # ======================================================
          # Collect Debian packages
          # ======================================================

          mkdir -p /workspace/dist


          find "$PKGROOT" \
            -maxdepth 3 \
            -type f \
            -name "*.deb" \
            -exec cp {} /workspace/dist/ \;


          echo
          echo "========================================"
          echo "Generated packages"
          echo "========================================"

          find /workspace/dist \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print


          # ======================================================
          # Final package check
          # ======================================================

          COUNT="$(
            find /workspace/dist \
              -maxdepth 1 \
              -type f \
              -name "*.deb" |
            wc -l
          )"


          if [ "$COUNT" -eq 0 ]; then

            echo "ERROR: No Debian packages generated."

            exit 1

          fi


          echo
          echo "Generated Debian package count:"
          echo "$COUNT"

          BUILD_SCRIPT


          chmod +x \
            "$GITHUB_WORKSPACE/build-kernel.sh"


      # ==========================================================
      # 14. Execute Arch build container
      # ==========================================================

      - name: Build in Arch Linux container
        if: steps.release.outputs.already_built != 'true'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          set -euo pipefail

          # ------------------------------------------------------
          # Use the latest Arch Linux environment for makepkg.
          # ------------------------------------------------------

          docker pull archlinux:base-devel


          # ------------------------------------------------------
          # ccache directory inside GitHub workspace
          # ------------------------------------------------------

          CCACHE_DIR_HOST="$GITHUB_WORKSPACE/.ccache/${PROCESSOR_SAFE}-${USE_LLVM_LTO}"


          mkdir -p "$CCACHE_DIR_HOST"


          # ------------------------------------------------------
          # Make PKGDIR relative to /workspace
          # ------------------------------------------------------

          PKGDIR_REL="${PKGDIR#./}"


          # ------------------------------------------------------
          # Run build script
          # ------------------------------------------------------

          docker run \
            --rm \
            --privileged \
            -e PKGDIR="$PKGDIR_REL" \
            -e PROCESSOR_OPT="$PROCESSOR_OPT" \
            -e USE_LLVM_LTO="$USE_LLVM_LTO" \
            -e CCACHE_HOST_DIR="/workspace/.ccache/${PROCESSOR_SAFE}-${USE_LLVM_LTO}" \
            -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            -e GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            /workspace/build-kernel.sh


      # ==========================================================
      # 15. Generate metadata
      # ==========================================================

      - name: Generate build metadata
        if: steps.release.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_RELEASE="$(
            cat kernel-release.txt
          )"


          cat > dist/BUILD-INFO.txt <<EOF
          CachyOS Kernel for Debian

          ========================================
          Build
          ========================================

          processor_opt:
          $PROCESSOR_OPT

          _use_llvm_lto:
          $USE_LLVM_LTO

          Variant:
          $VARIANT

          Kernel release:
          $KERNEL_RELEASE

          ========================================
          CachyOS
          ========================================

          Version:
          ${CACHYOS_PKGVER}-${CACHYOS_PKGREL}

          Source:
          ${CACHYOS_SRCNAME}

          linux-cachyos commit:
          ${UPSTREAM_COMMIT}

          Build fingerprint:
          ${BUILD_FINGERPRINT}

          ========================================
          Debug
          ========================================

          Requested configuration:

          CONFIG_DEBUG_KERNEL=n
          CONFIG_DEBUG_INFO_REDUCED=y

          ========================================
          CPU optimization note
          ========================================

          generic_v3:
          x86-64-v3 baseline.

          native:
          optimized for the CPU of the GitHub Actions
          runner performing this build.

          native does NOT mean the RedmiBook CPU.

          ========================================
          Toolchain
          ========================================

          Arch Linux
          Clang
          LLVM
          LLD
          ccache
          Linux bindeb-pkg

          EOF


      # ==========================================================
      # 16. Generate SHA256
      # ==========================================================

      - name: Generate SHA256
        if: steps.release.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          sha256sum \
            *.deb \
            > SHA256SUMS

          echo
          echo "========================================"
          echo "SHA256SUMS"
          echo "========================================"

          cat SHA256SUMS


      # ==========================================================
      # 17. Show final result
      # ==========================================================

      - name: Show result
        if: steps.release.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "Final packages"
          echo "========================================"

          ls -lh \
            dist/*.deb

          echo
          echo "========================================"
          echo "Kernel"
          echo "========================================"

          cat kernel-release.txt

          echo
          echo "========================================"
          echo "Variant"
          echo "========================================"

          echo "$VARIANT"


      # ==========================================================
      # 18. Upload Artifact
      # ==========================================================

      - name: Upload Debian packages
        if: steps.release.outputs.already_built != 'true'
        uses: actions/upload-artifact@v7

        with:

          name: >-
            cachyos-debian-
            ${{ env.PROCESSOR_SAFE }}-
            ${{ env.USE_LLVM_LTO }}-
            ${{ env.BUILD_FINGERPRINT }}

          path: |
            dist/*.deb
            dist/BUILD-INFO.txt
            dist/SHA256SUMS

          if-no-files-found: error

          retention-days: 30


      # ==========================================================
      # 19. Create GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        if: steps.release.outputs.already_built != 'true'
        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          KERNEL_RELEASE="$(
            cat kernel-release.txt
          )


          gh release create \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CachyOS Debian Kernel ${KERNEL_RELEASE}" \
            --notes "$(cat <<EOF
          # CachyOS Kernel for Debian

          Automatically built from:

          https://github.com/CachyOS/linux-cachyos

          ## Build configuration

          **processor_opt**

          \`${PROCESSOR_OPT}\`

          **_use_llvm_lto**

          \`${USE_LLVM_LTO}\`

          **Variant**

          \`${VARIANT}\`

          ## Debug configuration

          The workflow explicitly executes:

          \`\`\`
          scripts/config \\
              -d DEBUG_KERNEL \\
              -e DEBUG_INFO_REDUCED
          \`\`\`

          Requested final configuration:

          \`\`\`
          CONFIG_DEBUG_KERNEL=n
          CONFIG_DEBUG_INFO_REDUCED=y
          \`\`\`

          ## Kernel

          Kernel release:

          \`${KERNEL_RELEASE}\`

          CachyOS version:

          \`${CACHYOS_PKGVER}-${CACHYOS_PKGREL}\`

          Source:

          \`${CACHYOS_SRCNAME}\`

          ## Upstream commit

          \`${UPSTREAM_COMMIT}\`

          ## Build fingerprint

          \`${BUILD_FINGERPRINT}\`

          ## CPU optimization

          \`generic_v3\` uses an x86-64-v3 baseline.

          \`native\` targets the CPU of the GitHub Actions runner
          used for this build, not the user's local machine.

          ## Compiler

          - Clang
          - LLVM
          - LLD
          - ccache
          - Linux bindeb-pkg

          EOF
          )" \
            dist/*.deb \
            dist/BUILD-INFO.txt \
            dist/SHA256SUMS
